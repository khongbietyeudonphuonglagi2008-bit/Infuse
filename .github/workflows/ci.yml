name: Build verification

on:
  pull_request:
    branches: ["dev/2.4.5"]
  push:
    branches: ["dev/2.4.5", "codex/**"]

permissions:
  contents: read

jobs:
  build-1-21-11:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout sources
        uses: actions/checkout@v6
      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Pin Canvas target compatibility
        run: |
          sed -i 's/javaVersion=.*/javaVersion=21/' gradle.properties
          sed -i 's/minecraftVersion=.*/minecraftVersion=1.21.11/' gradle.properties
      - name: Compile and test
        run: ./gradlew clean build --stacktrace --no-daemon
      - name: Upload plugin jar
        if: success()
        uses: actions/upload-artifact@v6
        with:
          name: InfuseSMP-1.21.11
          path: build/libs/*.jar
          if-no-files-found: error
